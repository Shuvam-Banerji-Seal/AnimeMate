plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'androidx.navigation.safeargs.kotlin'
}

android {
    namespace "com.animerec.app"
    compileSdk 35
    
    defaultConfig {
        applicationId "com.animerec.app"
        minSdk 31 // Android 12
        targetSdk 35
        versionCode 3
        versionName "1.1.1"
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Support vector drawables for older versions
        vectorDrawables.useSupportLibrary = true
        
        // Enable multidex
        multiDexEnabled true
    }
    
    signingConfigs {
        release {
            // Read credentials from local.properties (git-ignored) or env vars.
            // Never hardcode signing credentials — anyone with read access to
            // the repo could sign malicious updates that pass signature
            // verification. See S1 in CHANGELOG.md.
            Properties localProps = new Properties()
            def localPropsFile = rootProject.file("local.properties")
            if (localPropsFile.exists()) {
                localPropsFile.withInputStream { localProps.load(it) }
            }
            def envStorePassword = System.getenv("ANIMEMATE_KEYSTORE_PASSWORD")
            def envKeyPassword = System.getenv("ANIMEMATE_KEY_PASSWORD")
            storeFile file(localProps.getProperty(
                "animemate.keystore",
                System.getenv("ANIMEMATE_KEYSTORE_FILE") ?: "../AnimeMate.keystore"
            ))
            storePassword localProps.getProperty(
                "animemate.keystore.password",
                envStorePassword ?: ""
            )
            keyAlias localProps.getProperty(
                "animemate.key.alias",
                "AnimeMate"
            )
            keyPassword localProps.getProperty(
                "animemate.key.password",
                envKeyPassword ?: ""
            )
        }
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Enable minify and shrink resources
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Optimize for release
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            pseudoLocalesEnabled false
        }
        
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
    
    // Enable R8 for better optimization
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }

    // Avoid duplicate file exceptions

    // Name the output APK "AnimeMate"
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "AnimeMate-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // Android Core Libraries
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    
    // ViewModel and LiveData
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    
    // Room Database
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    
    // Retrofit for API calls
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    
    // Security library for token encryption
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    
    // Glide for Image Loading
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    
    // Card Stack View (for Tinder-like swiping)
    implementation 'com.github.yuyakaido:CardStackView:2.3.4'
    
    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    
    // Data Store Preferences (for token storage)
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    
    // WorkManager for background tasks
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    
    // LeakCanary for memory leak detection (debug only)
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
    testImplementation "io.mockk:mockk:1.13.10"
    testImplementation "org.robolectric:robolectric:4.12.2"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "com.google.truth:truth:1.4.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}